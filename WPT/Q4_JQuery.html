<!-- Write a jQuery program to hide all headings on a page when they are clicked. o Also
find the position of the mouse pointer relative to the left and top edges of the
document -->


<!DOCTYPE html>
<html>
<head>
    <title>jQuery Task</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #position {
            position: fixed;
            bottom: 5px;
            right: 5px;
            padding: 5px;
            background: #f2f2f2;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <div id="position">Mouse Position: </div>

    <script>
        $(document).ready(function() {

            $("h1, h2, h3").click(function() {
                $(this).hide();
            });

      
            $(document).mousemove(function(event) {
                let x = event.pageX; 
                let y = event.pageY; 

                $("#position").text("Mouse Position: X = " + x + ", Y = " + y);
            });

        });
    </script>

</body>
</html>
